<style>
  :root {
    --bg:#f7f7f7; --bg-2:#ececec; --ink:#1a1a1a; --dark:#141415; --muted:#6a6a6c;
    --border:#e0e0e0; --surface:#ffffff; --gold:#face35; --gold-dark:#b58900;
    --accent-grad:linear-gradient(135deg,#face35 0%,#f9a934 100%);
    --radius:12px; --radius-lg:18px;
    --shadow-sm:0 2px 8px rgba(26,26,26,0.06); --shadow-lg:0 20px 60px rgba(0,0,0,0.3);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; color:var(--ink); background:var(--bg); line-height:1.65; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  .container { max-width:1180px; margin:0 auto; padding:0 24px; }
  h1,h2,h3 { font-family:'Archivo',sans-serif; font-weight:800; line-height:1.1; letter-spacing:-0.02em; }
  h1 { font-size:clamp(1.9rem,4.4vw,3.1rem); font-weight:900; }
  p { margin-bottom:1rem; }
  a { color:var(--gold-dark); }
  .btn { display:inline-flex; align-items:center; justify-content:center; background:var(--accent-grad); color:var(--ink); padding:16px 30px; border-radius:8px; font-weight:700; font-size:0.9rem; text-decoration:none; text-transform:uppercase; letter-spacing:1.4px; box-shadow:0 8px 24px rgba(250,206,53,0.3); transition:transform .2s, box-shadow .2s; }
  .btn:hover { transform:translateY(-2px); box-shadow:0 14px 32px rgba(250,206,53,0.45); }
  .top { background:var(--dark); color:#f4f4f4; text-align:center; padding:28px 0 190px; position:relative; }
  .top::after { content:""; position:absolute; inset:0; background:radial-gradient(ellipse at 50% 0%, rgba(250,206,53,0.14) 0%, transparent 55%); pointer-events:none; }
  .top .container { position:relative; z-index:1; }
  .top h1 { color:#fff; margin-bottom:0.9rem; }
  .top p.note { color:#d6d6d6; max-width:660px; margin:0 auto; font-size:1.06rem; }
  .steps { max-width:520px; margin:0 auto 34px; }
  .steps .track { height:8px; border-radius:99px; background:rgba(255,255,255,0.14); overflow:hidden; }
  .steps .track i { display:block; height:100%; background:var(--accent-grad); border-radius:99px; }
  .steps span { display:block; margin-top:8px; color:var(--gold); font-weight:700; font-size:0.8rem; letter-spacing:2px; text-transform:uppercase; }
  .shell { margin-top:-150px; padding-bottom:80px; position:relative; z-index:2; }
  .card { background:var(--surface); border:1px solid var(--border); border-top:5px solid var(--gold); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); }
  footer { background:#0d0d0e; color:#8a8a8c; text-align:center; padding:36px 0; font-size:0.86rem; }
  footer a { color:var(--gold); }
  .top { padding-bottom:210px; }
  .confirm { max-width:680px; margin:0 auto; padding:44px 40px; text-align:center; }
  .tick { width:74px; height:74px; border-radius:50%; background:var(--accent-grad); margin:0 auto 20px; display:flex; align-items:center; justify-content:center; }
  .tick::after { content:""; width:26px; height:14px; border-left:5px solid var(--ink); border-bottom:5px solid var(--ink); transform:rotate(-45deg) translate(2px,-3px); }
  .confirm p { font-size:1.08rem; color:#3d3d3f; }
  .confirm .question { margin:24px 0 0; padding:22px 24px; background:#fff8dc; border:1px solid var(--gold); border-left:5px solid var(--gold); border-radius:10px; font-family:'Archivo',sans-serif; font-weight:800; font-size:1.3rem; line-height:1.3; color:var(--ink); text-align:left; }
  @media (max-width:640px) { .confirm { padding:32px 22px; } }
</style>
</head>
<body>

<section class="top">
  <div class="container">
    <div class="steps" role="img" aria-label="Done">
      <div class="track"><i style="width:100%"></i></div>
      <span>Done</span>
    </div>
    <h1>You're booked in.</h1>
  </div>
</section>

<div class="shell">
  <div class="container">
    <div class="card confirm">
      <div class="tick" aria-hidden="true"></div>
      <p>Check your email for the details.</p>
      <p style="margin:0;">Before the call, have a think about one question:</p>
      <p class="question">What's the one thing in the business that still can't happen without you?</p>
    </div>
  </div>
</div>

<footer>
  <div class="container">
    <p>&copy; 2026 Develop Coaching · develop-coaching.com</p>
    <p style="margin-top:6px;">Questions? <a href="mailto:hello@develop-coaching.com">hello@develop-coaching.com</a></p>
  </div>
</footer>
</body>
</html>
